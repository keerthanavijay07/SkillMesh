// SkillMesh – React Application
// Subject: CS23531 Web Programming
// Concepts: React Components, JSX, State, Props, PropTypes,
//           Hooks (useState, useEffect, useMemo, useContext), React Router
// ============================================================

const { useState, useEffect, useMemo, createContext, useContext } = React;
// Robust Browser Hash Router for Standalone Browser Environment
const RouterContext = createContext({ pathname: "/", params: {}, navigate: () => {} });

function HashRouter({ children }) {
  const [pathname, setPathname] = useState(() => {
    const hash = window.location.hash;
    return hash ? hash.replace(/^#/, "") || "/" : "/";
  });

  useEffect(() => {
    const handleHashChange = () => {
      const hash = window.location.hash;
      const clean = hash ? hash.replace(/^#/, "") || "/" : "/";
      setPathname(clean);
      window.scrollTo(0, 0);
    };
    window.addEventListener("hashchange", handleHashChange);
    return () => window.removeEventListener("hashchange", handleHashChange);
  }, []);

  const navigate = (to) => {
    window.location.hash = to.startsWith("#") ? to : "#" + to;
  };

  return (
    <RouterContext.Provider value={{ pathname, navigate, params: {} }}>
      {children}
    </RouterContext.Provider>
  );
}

function useLocation() {
  const { pathname } = useContext(RouterContext);
  return { pathname, hash: window.location.hash, search: "" };
}

function useNavigate() {
  const { navigate } = useContext(RouterContext);
  return navigate;
}

function useParams() {
  const { params } = useContext(RouterContext);
  return params || {};
}

function matchRoute(routePath, currentPath) {
  if (routePath === currentPath) return { matched: true, params: {} };
  const rClean = (routePath || "").split("?")[0];
  const cClean = (currentPath || "").split("?")[0];
  const routeParts = rClean.split("/").filter(Boolean);
  const currentParts = cClean.split("/").filter(Boolean);
  if (routeParts.length !== currentParts.length) return { matched: false };
  const params = {};
  for (let i = 0; i < routeParts.length; i++) {
    if (routeParts[i].startsWith(":")) {
      params[routeParts[i].slice(1)] = decodeURIComponent(currentParts[i]);
    } else if (routeParts[i] !== currentParts[i]) {
      return { matched: false };
    }
  }
  return { matched: true, params };
}

function Routes({ children }) {
  const { pathname, navigate } = useContext(RouterContext);
  let matchedElement = null;
  let matchedParams = {};

  React.Children.forEach(children, (child) => {
    if (!child || matchedElement) return;
    const { path, element } = child.props;
    if (!path) return;
    const { matched, params } = matchRoute(path, pathname);
    if (matched) {
      matchedElement = element;
      matchedParams = params;
    }
  });

  return (
    <RouterContext.Provider value={{ pathname, navigate, params: matchedParams }}>
      {matchedElement}
    </RouterContext.Provider>
  );
}

function Route({ element }) {
  return element;
}

function Link({ to, children, className, style, ...props }) {
  const href = to.startsWith("#") ? to : "#" + to;
  return (
    <a href={href} className={className} style={style} {...props}>
      {children}
    </a>
  );
}

function NavLink({ to, children, className, style, ...props }) {
  const { pathname } = useContext(RouterContext);
  const targetPath = to.startsWith("#") ? to.slice(1) : to;
  const isActive = targetPath === "/" ? pathname === "/" : pathname.startsWith(targetPath);
  const resolvedClass = typeof className === "function" ? className({ isActive }) : `${className || ""} ${isActive ? "active" : ""}`.trim();
  const href = to.startsWith("#") ? to : "#" + to;
  return (
    <a href={href} className={resolvedClass} style={style} {...props}>
      {children}
    </a>
  );
}

// 2. Skill Badge Component
function SkillBadge({ name, level, levelLabel }) {
  let badgeClass = "badge rounded-pill bg-light text-primary border";
  if (level >= 90) badgeClass = "badge rounded-pill bg-success-subtle text-success border border-success-subtle";
  else if (level >= 75) badgeClass = "badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle";
  else if (level >= 50) badgeClass = "badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle";

  return (
    <span className={badgeClass + " px-2 py-1 me-1 mb-1 font-monospace"}>
      {name} {level ? <small className="fw-bold">({level}%)</small> : ""}
    </span>
  );
}

SkillBadge.propTypes = {
  name: PropTypes.string.isRequired,
  level: PropTypes.number,
  levelLabel: PropTypes.string
};

// 3. Skill Progress Bar Component
function SkillProgress({ name, currentCoverage, requiredLevel = 70, showDetails = true }) {
  const status = getSkillStatus(currentCoverage, requiredLevel);
  const colorClass = getProgressBarColor(currentCoverage, requiredLevel);

  return (
    <div className="skill-progress-wrap mb-3">
      <div className="skill-progress-label d-flex justify-content-between align-items-center mb-1">
        <div className="d-flex align-items-center gap-2">
          <span className="skill-progress-name fw-semibold">{name}</span>
          <span className={`badge bg-${status.variant} rounded-pill`} style={{ fontSize: "0.68rem" }}>
            {status.label}
          </span>
        </div>
        <div className="small text-muted">
          <span className="fw-bold text-dark">{currentCoverage}%</span>
          {showDetails && <span className="text-muted ms-1">(Req: {requiredLevel}%)</span>}
        </div>
      </div>
      <div className="progress" style={{ height: "10px", borderRadius: "50px", backgroundColor: "#e9edf7" }}>
        <div
          className={`progress-bar ${colorClass} progress-bar-striped progress-bar-animated`}
          role="progressbar"
          style={{ width: `${Math.min(100, currentCoverage)}%`, transition: "width 1s ease" }}
          aria-valuenow={currentCoverage}
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>
    </div>
  );
}

SkillProgress.propTypes = {
  name: PropTypes.string.isRequired,
  currentCoverage: PropTypes.number.isRequired,
  requiredLevel: PropTypes.number,
  showDetails: PropTypes.bool
};

  return (
    <div className="card sm-card h-100 shadow-sm border-0 position-relative">
      <div className="card-body p-3 p-md-4 d-flex flex-column justify-content-between">
        <div>
          <div className="d-flex align-items-start gap-3 mb-3">
            <div
              className="student-avatar text-white fw-bold shadow-sm"
              style={{ background: student.avatar_color || "var(--primary)" }}
            >
              {student.initials || getInitials(student.name)}
            </div>
            <div className="flex-grow-1">
              <h5 className="card-title fw-bold mb-1 text-dark">{student.name}</h5>
              <div className="text-muted small mb-1">
                <span className="badge bg-light text-secondary border me-1">{student.student_id}</span>
                <span>{student.department} • {student.year}</span>
              </div>
              <div className="text-primary fw-medium small">
                <i className="bi bi-person-badge me-1"></i>
                {student.role}
              </div>
            </div>
          </div>

          <div className="mb-3">
            <div className="text-muted small fw-semibold mb-2">Key Skills:</div>
            <div className="d-flex flex-wrap">
              {student.skills && student.skills.slice(0, 4).map((s, idx) => (
                <SkillBadge key={idx} name={s.name} level={s.level} levelLabel={s.levelLabel} />
              ))}
              {student.skills && student.skills.length > 4 && (
                <span className="badge rounded-pill bg-light text-muted border px-2 py-1 mb-1">
                  +{student.skills.length - 4} more
                </span>
              )}
            </div>
          </div>
        </div>

        {showAction && (
          <div className="pt-2 border-top mt-auto d-flex gap-2">
            {isSelected ? (
              <button
                className="btn btn-outline-danger btn-sm w-100 rounded-pill d-flex align-items-center justify-content-center gap-1"
                onClick={() => onRemove && onRemove(student.id)}
              >
                <i className="bi bi-person-dash"></i> Remove from Team
              </button>
            ) : onAdd ? (
              <button
                className="btn btn-primary-sm btn-sm w-100 rounded-pill justify-content-center"
                onClick={() => onAdd(student.id)}
              >
                <i className="bi bi-person-plus"></i> Add to Team
              </button>
            ) : onRequestCollab ? (
              <button
                className="btn btn-outline-primary btn-sm w-100 rounded-pill d-flex align-items-center justify-content-center gap-1"
                onClick={() => onRequestCollab(student)}
              >
                <i className="bi bi-send"></i> Request Collaboration
              </button>
            ) : null}
          </div>
        )}
      </div>
    </div>
  );
}

StudentCard.propTypes = {
  student: PropTypes.object.isRequired,
  onAdd: PropTypes.func,
  onRemove: PropTypes.func,
  isSelected: PropTypes.bool,
  showAction: PropTypes.bool,
  onRequestCollab: PropTypes.func
};

// 5. Team Health Card
function TeamHealthCard({ score, memberCount, requiredSize }) {
  const healthInfo = getHealthLabel(score);
  const strokeDashoffset = 380 - (380 * score) / 100;
  const statusColor = score >= 75 ? "#00c897" : score >= 50 ? "#ffb300" : "#ef5350";

  return (
    <div className="card sm-card border-0 shadow-sm text-center p-4 bg-white">
      <h5 className="fw-bold text-dark mb-3">Overall Team Health</h5>
      
      <div className="d-flex justify-content-center my-2 position-relative">
        <svg width="150" height="150" viewBox="0 0 140 140">
          <circle
            cx="70"
            cy="70"
            r="60"
            fill="none"
            stroke="#e9edf7"
            strokeWidth="12"
          />
          <circle
            cx="70"
            cy="70"
            r="60"
            fill="none"
            stroke={statusColor}
            strokeWidth="12"
            strokeDasharray="380"
            strokeDashoffset={strokeDashoffset}
            strokeLinecap="round"
            transform="rotate(-90 70 70)"
            style={{ transition: "stroke-dashoffset 1.2s ease" }}
          />
        </svg>
        <div
          className="position-absolute d-flex flex-column align-items-center justify-content-center"
          style={{ inset: 0 }}
        >
          <span className="display-6 fw-bold" style={{ color: statusColor }}>{score}%</span>
          <span className="badge rounded-pill text-uppercase" style={{ backgroundColor: `${statusColor}22`, color: statusColor, fontSize: '0.7rem' }}>
            {healthInfo.label}
          </span>
        </div>
      </div>

      <div className="mt-3 text-muted small">
        <div className="d-flex justify-content-between px-3 py-1 border-bottom">
          <span>Team Size:</span>
          <span className="fw-bold text-dark">{memberCount} / {requiredSize} Members</span>
        </div>
        <div className="d-flex justify-content-between px-3 py-1 mt-1">
          <span>Health Status:</span>
          <span className="fw-bold" style={{ color: statusColor }}>{healthInfo.label} Coverage</span>
        </div>
      </div>
    </div>
  );
}

TeamHealthCard.propTypes = {
  score: PropTypes.number.isRequired,
  memberCount: PropTypes.number.isRequired,
  requiredSize: PropTypes.number.isRequired
};

// 6. Project Risk Card
function RiskCard({ risk }) {
  const badgeClass =
    risk.severity === "HIGH"
      ? "bg-danger text-white"
      : risk.severity === "MEDIUM"
      ? "bg-warning text-dark"
      : "bg-success text-white";

  const cardBorder =
    risk.severity === "HIGH"
      ? "border-danger-subtle bg-danger-subtle bg-opacity-10"
      : risk.severity === "MEDIUM"
      ? "border-warning-subtle bg-warning-subtle bg-opacity-10"
      : "border-success-subtle bg-success-subtle bg-opacity-10";

  return (
    <div className={`card mb-3 border rounded-3 p-3 shadow-sm ${cardBorder}`}>
      <div className="d-flex justify-content-between align-items-start mb-2">
        <div className="d-flex align-items-center gap-2">
          <i className={`bi ${risk.icon || "bi-shield-exclamation"} fs-5 ${risk.severity === "HIGH" ? "text-danger" : risk.severity === "MEDIUM" ? "text-warning" : "text-success"}`}></i>

        <div className="d-flex justify-content-between align-items-center small mb-1">
          <span className="text-muted">Current Team Coverage:</span>

          <div
            className={`progress-bar ${progressColor} progress-bar-striped progress-bar-animated`}

            role="progressbar"
            aria-valuenow={coverage}

      <div className="p-2 rounded bg-light border border-light-subtle small mb-3 text-secondary">
        <i className="bi bi-info-circle-fill text-primary me-1"></i>
        {gap === 0

        <div className="pt-2 border-top mt-auto">

                  style={{ width: "20px", height: "20px", background: st.avatar_color || "var(--primary)", fontSize: "0.6rem" }}

                <span className="fw-semibold text-dark" style={{ fontSize: "0.72rem" }}>{st.name.split(" ")[0]}</span>

              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

  const [saveSuccess, setSaveSuccess] = useState(false);

  useEffect(() => {
    if (currentUser) {
      setProfileData({
        name: currentUser.name,
        department: currentUser.department,
        year: currentUser.year,
        role: currentUser.role
      });
      setSkills(currentUser.skills || []);
    }
  }, [currentUser]);

  const handleAddSkill = (e) => {
    e.preventDefault();
    if (!newSkill.name) return;
    const numericLevel = SKILL_LEVELS[newSkill.levelLabel] || 75;
    const updated = [...skills.filter((s) => s.name.toLowerCase() !== newSkill.name.toLowerCase()), {
      name: newSkill.name,
      level: numericLevel,
      levelLabel: newSkill.levelLabel
    }];
    setSkills(updated);
    updateProfileSkills(updated);
    setSaveSuccess(true);
    setTimeout(() => setSaveSuccess(false), 3000);

    const updated = skills.filter((s) => s.name !== skillName);

    updateProfileSkills(updated);

// 13. CREATE PROJECT PAGE
function CreateProjectPage() {
  const { addProject, currentUser } = useContext(AppContext);
  const navigate = useNavigate();
  const [formData, setFormData] = useState({
    name: "",
    description: "",
    category: "AgriTech",
    required_team_size: 4
  });
  const [selectedSkills, setSelectedSkills] = useState([
    { name: "Frontend", required_level: 70 },
    { name: "Backend", required_level: 75 },
    { name: "Database", required_level: 70 }
  ]);
  const [newSkillName, setNewSkillName] = useState("UI/UX");
  const [newSkillLevel, setNewSkillLevel] = useState(70);
  const [errors, setErrors] = useState({});

  const handleAddSkill = () => {
    if (!newSkillName) return;
    if (selectedSkills.some((s) => s.name.toLowerCase() === newSkillName.toLowerCase())) return;
    setSelectedSkills([...selectedSkills, { name: newSkillName, required_level: parseInt(newSkillLevel) }]);
  };

  const handleRemoveSkill = (name) => {
    setSelectedSkills(selectedSkills.filter((s) => s.name !== name));
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    const dataToValidate = {
      ...formData,
      required_skills: selectedSkills
    };
    const errs = validateProjectForm(dataToValidate);
    if (Object.keys(errs).length > 0) {
      setErrors(errs);
      return;
    }

    const newProj = await addProject({
      ...formData,
      required_team_size: parseInt(formData.required_team_size),
      required_skills: selectedSkills,
      created_by: currentUser?.id || 1,
      team_members: currentUser ? [currentUser.id] : [1]
    });

    navigate(`/team-builder/${newProj.id}`);
  };

  return (
    <div className="container py-5">
      <div className="row justify-content-center">
        <div className="col-lg-8">
          <div className="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            <div className="text-center mb-4">
              <div className="rounded-circle bg-primary-subtle text-primary d-inline-flex p-3 mb-2">
                <i className="bi bi-folder-plus fs-3"></i>
              </div>
              <h3 className="fw-bold">Create New Project</h3>
              <p className="text-muted small">Define your project requirements and skill parameters</p>
            </div>

            <form onSubmit={handleSubmit}>
              <div className="mb-3">
                <label className="form-label">Project Name</label>
                <input
                  type="text"
                  className={`form-control ${errors.name ? "is-invalid" : ""}`}
                  placeholder="e.g. Smart Agriculture Platform"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                />
                {errors.name && <div className="text-danger small mt-1">{errors.name}</div>}
              </div>

              <div className="mb-3">
                <label className="form-label">Project Description</label>
                <textarea
                  rows="3"
                  className={`form-control ${errors.description ? "is-invalid" : ""}`}
                  placeholder="Describe your project goals, technologies, and target deliverables..."
                  value={formData.description}
                  onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                ></textarea>
                {errors.description && <div className="text-danger small mt-1">{errors.description}</div>}
              </div>

              <div className="row g-3 mb-4">
                <div className="col-md-6">
                  <label className="form-label">Project Category</label>
                  <select
                    className="form-select"
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                  >
                    {PROJECT_CATEGORIES.map((c, i) => <option key={i} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="col-md-6">
                  <label className="form-label">Required Team Size (Students)</label>
                  <input

function TeamBuilderPage({ initialTab = "intelligence" }) {
  const { id } = useParams();

  const [activeTab, setActiveTab] = useState(initialTab); // 'intelligence' | 'builder' | 'gaps' | 'risks' | 'recommendations'
  const [searchTerm, setSearchTerm] = useState("");
  const [modalStudent, setModalStudent] = useState(null);
  const [collabMsg, setCollabMsg] = useState("");
  const [collabSent, setCollabSent] = useState(false);

  useEffect(() => {
    if (initialTab) setActiveTab(initialTab);
  }, [initialTab]);

  const projId = id ? parseInt(id) : (projects[0]?.id || 1);
  const project = projects.find((p) => p.id === projId) || projects[0];

  if (!project) {
    return (
      <div className="container py-5 text-center">
        <h4>Project not found.</h4>
        <Link to="/dashboard" className="btn btn-primary-sm mt-3">Back to Dashboard</Link>
      </div>
    );
  }

  // Selected team objects
  const teamMembers = students.filter((s) => project.team_members.includes(s.id));
  
  // Rule-based calculations (No AI/ML)
  const teamHealth = calculateTeamHealth(project, teamMembers);
  const risks = sortRisksByPriority(detectRisks(project, teamMembers));
  const recommendations = getRecommendations(project, project.team_members, students);

  // Filtered students for builder
  const filteredStudents = students.filter((s) => {
    const matchSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
      s.role.toLowerCase().includes(searchTerm.toLowerCase()) ||
      s.skills.some((sk) => sk.name.toLowerCase().includes(searchTerm.toLowerCase()));
    return matchSearch;
  });

  const handleOpenCollabModal = (student) => {
    setModalStudent(student);
    setCollabMsg(`Hi ${student.name.split(" ")[0]}! We are working on "${project.name}" and would love to have your skills on our team.`);
    setCollabSent(false);

  const handleSendCollab = (e) => {
    e.preventDefault();
    if (!modalStudent) return;
    sendCollabRequest({
      from_student_id: currentUser?.id || 1,
      to_student_id: modalStudent.id,
      project_id: project.id,

    });
    setCollabSent(true);

      setModalStudent(null);
      setCollabSent(false);

            <div

                  (s) => !project.team_members.includes(s.id) && s.skills && s.skills.some((sk) => isSkillMatch(sk.name, rs.name) && sk.level >= 50)
                );
                return (
                  <div key={idx} className="col-md-6 col-lg-4">
                    <SkillGapCard
                      skill={rs}
                      coverage={cov}
                      required={rs.required_level}
                      candidateStudents={candidates}
                      onAddStudent={(stId) => toggleTeamMember(project.id, stId)}
                    />
                  </div>
                );
              })}
            </div>

            <h5 className="fw-bold mb-3 mt-4">Tabular Skill Gap Matrix</h5>
            <div className="table-responsive">
              <table className="table table-hover align-middle">
                <thead className="table-light">
                  <tr>
                    <th>Required Skill</th>
                    <th>Required Level</th>
                    <th>Current Team Coverage</th>
                    <th>Coverage Gap</th>
                    <th>Status</th>
                    <th>Actionable Recommendation</th>
                  </tr>
                </thead>
                <tbody>
                  {project.required_skills.map((rs, idx) => {
                    const cov = calculateSkillCoverage(rs.name, teamMembers);
                    const gap = Math.max(0, rs.required_level - cov);
                    const status = getSkillStatus(cov, rs.required_level);

                    return (
                      <tr key={idx}>
                        <td className="fw-bold">{rs.name}</td>
                        <td>{rs.required_level}%</td>
                        <td>
                          <div className="d-flex align-items-center gap-2">
                            <span className="fw-semibold">{cov}%</span>
                            <div className="progress flex-grow-1" style={{ height: "6px", width: "80px" }}>
                              <div
                                className={`progress-bar ${getProgressBarColor(cov, rs.required_level)}`}
                                style={{ width: `${cov}%` }}
                              ></div>
                            </div>
                          </div>
                        </td>
                        <td className={gap > 0 ? "text-danger fw-bold" : "text-success fw-bold"}>
                          {gap > 0 ? `-${gap}%` : "None (Met)"}
                        </td>
                        <td>
                          <span className={`badge bg-${status.variant} rounded-pill`}>
                            {status.label}
                          </span>
                        </td>
                        <td className="small text-muted">
                          {gap === 0
                            ? "Sufficiently covered by active members."
                            : cov === 0
                            ? `Recruit a dedicated ${rs.name} specialist immediately.`
                            : `Add overlapping ${rs.name} peer to reach required threshold.`}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* TAB 4: RISK ANALYSIS */}
      {activeTab === "risks" && (
        <div className="animate-fade">
          <div className="card sm-card border-0 shadow-sm p-4 mb-4">

// 19. MAIN APP ROOT PROVIDER & ROUTER
function App() {
  const API_URL = (window.location.protocol === "file:") 
    ? "http://127.0.0.1:8000/php/api.php" 
    : "php/api.php";

  const [currentUser, setCurrentUser] = useState(() => {
    try {
      const saved = sessionStorage.getItem("skillmesh_user");
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return SAMPLE_STUDENTS[0];
  });
  const [students, setStudents] = useState(() => SAMPLE_STUDENTS);
  const [projects, setProjects] = useState(() => SAMPLE_PROJECTS);
  const [requests, setRequests] = useState(() => SAMPLE_REQUESTS);
  const [isBackendConnected, setIsBackendConnected] = useState(false);
  const [darkMode, setDarkMode] = useState(() => {
    try { return localStorage.getItem("skillmesh_theme") === "dark"; } catch(e) { return false; }
  });

  useEffect(() => {
    const html = document.documentElement;
    if (darkMode) {
      html.setAttribute("data-theme", "dark");
    } else {
      html.removeAttribute("data-theme");
    }
    try { localStorage.setItem("skillmesh_theme", darkMode ? "dark" : "light"); } catch(e) {}
  }, [darkMode]);

  const toggleDarkMode = () => setDarkMode(prev => !prev);

  // When React app successfully mounts, hide the HTML loading spinner
  useEffect(() => {
    const loadingScreen = document.getElementById("loading-screen");
    if (loadingScreen) {
      loadingScreen.style.setProperty("display", "none", "important");
      loadingScreen.remove();
    }
  }, []);

  // Fetch live backend data with fallback to sample data
  useEffect(() => {
    let isMounted = true;
    const fetchBackendData = async () => {
      try {
        const [studRes, projRes, reqRes] = await Promise.all([
          fetch(`${API_URL}?action=get_students`).then(r => r.json()).catch(() => null),
          fetch(`${API_URL}?action=get_projects`).then(r => r.json()).catch(() => null),
          fetch(`${API_URL}?action=get_requests`).then(r => r.json()).catch(() => null)
        ]);

        if (!isMounted) return;

        let connected = false;
        if (studRes && studRes.status === "success" && Array.isArray(studRes.data) && studRes.data.length > 0) {
          setStudents(studRes.data);
          connected = true;
          // Sync currentUser with live student data if present
          setCurrentUser(prev => {
            if (!prev) return studRes.data[0];
            const match = studRes.data.find(s => s.id === prev.id || s.email.toLowerCase() === prev.email.toLowerCase());
            return match || prev;
          });
        }
        if (projRes && projRes.status === "success" && Array.isArray(projRes.data) && projRes.data.length > 0) {
          setProjects(projRes.data);
          connected = true;
        }
        if (reqRes && reqRes.status === "success" && Array.isArray(reqRes.data)) {
          setRequests(reqRes.data);
        }

        setIsBackendConnected(connected);
      } catch (err) {
        console.warn("Operating in Standalone Fallback Mode (Sample Data):", err);
      }
    };

    fetchBackendData();
    return () => { isMounted = false; };
  }, []);

  // Authentication Handlers
  const loginUser = async (email, password) => {
    try {
      const res = await fetch(`${API_URL}?action=login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.trim(), password })
      });
      const data = await res.json();
      if (data && data.status === "success" && data.data) {
        setCurrentUser(data.data);
        try { sessionStorage.setItem("skillmesh_user", JSON.stringify(data.data)); } catch (e) {}
        setIsBackendConnected(true);
        return true;
      }
    } catch (e) {
      console.warn("Backend login failed or unreachable, checking fallback data...", e);
    }

    // Fallback: in-memory student lookup
    const found = students.find((s) => s.email.toLowerCase() === email.trim().toLowerCase());
    if (found) {
      setCurrentUser(found);
      try { sessionStorage.setItem("skillmesh_user", JSON.stringify(found)); } catch (e) {}
      return true;
    }
    return false;
  };

  const logoutUser = () => {
    setCurrentUser(null);
    try { sessionStorage.removeItem("skillmesh_user"); } catch (e) {}
  };

  const registerUser = async (data) => {
    try {
      const res = await fetch(`${API_URL}?action=register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const resData = await res.json();
      if (resData && resData.status === "success" && resData.data) {
        const newStudent = resData.data;
        setStudents(prev => [...prev, newStudent]);
        setCurrentUser(newStudent);
        try { sessionStorage.setItem("skillmesh_user", JSON.stringify(newStudent)); } catch (e) {}
        setIsBackendConnected(true);
        return newStudent;
      }
    } catch (e) {
      console.warn("Backend register failed or unreachable, falling back to local state...", e);
    }

    // Fallback: in-memory registration
    const newId = students.length + 1;
    const newStudent = {
      id: newId,
      name: data.name,
      initials: getInitials(data.name),
      student_id: `CS220${newId < 10 ? "0" + newId : newId}`,
      department: data.department,
      year: data.year,
      role: data.role,
      email: data.email,
      avatar_color: "#1a6cf6",
      skills: [
        { name: "Frontend", level: 80, levelLabel: "Advanced" },
        { name: "JavaScript", level: 75, levelLabel: "Advanced" }
      ]
    };
    setStudents(prev => [...prev, newStudent]);
    setCurrentUser(newStudent);
    try { sessionStorage.setItem("skillmesh_user", JSON.stringify(newStudent)); } catch (e) {}
    return newStudent;
  };

  // Profile update handlers
  const updateProfileSkills = async (updatedSkills) => {
    if (!currentUser) return;
    const updated = { ...currentUser, skills: updatedSkills };
    setCurrentUser(updated);
    try { sessionStorage.setItem("skillmesh_user", JSON.stringify(updated)); } catch (e) {}
    setStudents(prev => prev.map((s) => (s.id === currentUser.id ? updated : s)));

    try {
      await fetch(`${API_URL}?action=update_skills`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ student_id: currentUser.id, skills: updatedSkills })
      });
      setIsBackendConnected(true);
    } catch (e) {
      console.warn("Backend update_skills unreachable, retained local change:", e);
    }
  };

  const updateProfileDetails = async (details) => {
    if (!currentUser) return;
    const updated = { ...currentUser, ...details, initials: getInitials(details.name) };
    setCurrentUser(updated);
    try { sessionStorage.setItem("skillmesh_user", JSON.stringify(updated)); } catch (e) {}
    setStudents(prev => prev.map((s) => (s.id === currentUser.id ? updated : s)));

    try {
      await fetch(`${API_URL}?action=update_profile`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          student_id: currentUser.id,
          name: details.name,
          department: details.department,
          year: details.year,
          role: details.role
        })
      });
      setIsBackendConnected(true);
    } catch (e) {
      console.warn("Backend update_profile unreachable, retained local change:", e);
    }
  };

  // Project handlers
  const addProject = async (projData) => {
    try {
      const res = await fetch(`${API_URL}?action=create_project`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ...projData,
          created_by: currentUser?.id || projData.created_by || 1
        })
      });
      const resData = await res.json();
      if (resData && resData.status === "success" && resData.data) {
        const created = resData.data;
        setProjects(prev => [created, ...prev]);
        setIsBackendConnected(true);
        return created;
      }
    } catch (e) {
      console.warn("Backend create_project unreachable, saving to local state...", e);
    }

    // Fallback: in-memory project addition
    const newId = projects.length + 1;
    const newProj = {
      id: newId,
      ...projData,
      status: "Active"
    };
    setProjects(prev => [newProj, ...prev]);
    return newProj;
  };

  const toggleTeamMember = async (projectId, studentId) => {
    // Optimistic UI update
    setProjects(prev =>
      prev.map((p) => {
        if (p.id !== projectId) return p;
        const exists = p.team_members.includes(studentId);
        const updated = exists
          ? p.team_members.filter((id) => id !== studentId)
          : [...p.team_members, studentId];
        return { ...p, team_members: updated };
      })
    );

    // Call backend API
    try {
      const res = await fetch(`${API_URL}?action=toggle_member`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project_id: projectId, student_id: studentId })
      });
      const data = await res.json();
      if (data && data.status === "success") {
        setIsBackendConnected(true);
      }
    } catch (e) {
      console.warn("Backend toggle_member unreachable, retained local change:", e);
    }
  };

  // Request handlers
  const sendCollabRequest = async (reqData) => {
    const newReq = {
      id: requests.length + 1,
      ...reqData,
      status: "pending",
      date: new Date().toISOString().split("T")[0]
    };
    setRequests(prev => [newReq, ...prev]);

    try {
      await fetch(`${API_URL}?action=send_request`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(reqData)
      });
      setIsBackendConnected(true);
    } catch (e) {
      console.warn("Backend send_request unreachable, retained local request:", e);
    }
  };

  const respondToRequest = async (requestId, newStatus) => {
    setRequests(prev =>
      prev.map((r) => {
        if (r.id !== requestId) return r;
        if (newStatus === "accepted") {
          toggleTeamMember(r.project_id, r.to_student_id);
        }
        return { ...r, status: newStatus };
      })
    );

    try {
      await fetch(`${API_URL}?action=respond_request`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ request_id: requestId, status: newStatus })
      });
      setIsBackendConnected(true);
    } catch (e) {
      console.warn("Backend respond_request unreachable, retained local update:", e);
    }
  };

  const pendingRequestsCount = useMemo(() => {
    if (!currentUser) return 0;
    return requests.filter((r) => r.to_student_id === currentUser.id && r.status === "pending").length;
  }, [requests, currentUser]);

  const contextValue = {
    currentUser,
    students,
    projects,
    requests,
    isBackendConnected,
    darkMode,
    loginUser,
    logoutUser,
    registerUser,
    updateProfileSkills,
    updateProfileDetails,
    addProject,
    toggleTeamMember,
    sendCollabRequest,
    respondToRequest
  };

  return (
    <AppContext.Provider value={contextValue}>
      <HashRouter>
        <div className="d-flex flex-column min-vh-100 bg-surface-2">
          <Navbar
            currentUser={currentUser}
            onLogout={logoutUser}
            requestsCount={pendingRequestsCount}
            isBackendConnected={isBackendConnected}
            darkMode={darkMode}
            onToggleDark={toggleDarkMode}
          />

          <main className="flex-grow-1">
            <Routes>
              <Route path="/" element={<HomePage />} />
              <Route path="/login" element={<LoginPage />} />
              <Route path="/register" element={<RegisterPage />} />
              <Route path="/dashboard" element={<StudentDashboard />} />
              <Route path="/profile" element={<StudentProfilePage />} />
              <Route path="/projects" element={<ProjectDetailsPage />} />
              <Route path="/create-project" element={<CreateProjectPage />} />
              <Route path="/project/:id" element={<ProjectDetailsPage />} />
              <Route path="/team-builder" element={<TeamBuilderPage initialTab="builder" />} />
              <Route path="/team-builder/:id" element={<TeamBuilderPage initialTab="builder" />} />
              <Route path="/team-intelligence" element={<TeamBuilderPage initialTab="intelligence" />} />
              <Route path="/team-intelligence/:id" element={<TeamBuilderPage initialTab="intelligence" />} />
              <Route path="/skill-gaps" element={<TeamBuilderPage initialTab="gaps" />} />
              <Route path="/skill-gaps/:id" element={<TeamBuilderPage initialTab="gaps" />} />
              <Route path="/risk-analysis" element={<TeamBuilderPage initialTab="risks" />} />
              <Route path="/risk-analysis/:id" element={<TeamBuilderPage initialTab="risks" />} />
              <Route path="/recommendations" element={<TeamBuilderPage initialTab="recommendations" />} />
              <Route path="/recommendations/:id" element={<TeamBuilderPage initialTab="recommendations" />} />
              <Route path="/students" element={<ExploreStudentsPage />} />
              <Route path="/requests" element={<CollaborationRequestsPage />} />
            </Routes>
          </main>

          <Footer />
        </div>
      </HashRouter>
    </AppContext.Provider>
  );
}

// Render React App with safety check
const rootElement = document.getElementById("root");
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
  const ls = document.getElementById("loading-screen");
  if (ls) ls.remove();
}
  </script>

</body>
</html>
